spring:
  application:
    name: agent

  config:
    import: optional:file:./.env[.properties]

  main:
    allow-circular-references: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/real_estate_due_diligence}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

app:
  frontend:
    base-url: ${FRONTEND_URL:https://realestate-due-diligence.vercel.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://realestate-due-diligence.vercel.app}
  verification:
    token-expiration-minutes: ${VERIFICATION_TOKEN_EXPIRATION_MINUTES:1440}
  external-api:
    allowed-hosts: ${EXTERNAL_API_ALLOWED_HOSTS:}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000}
