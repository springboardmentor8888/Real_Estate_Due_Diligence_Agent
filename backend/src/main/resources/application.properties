spring.application.name=due-diligence

spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_db
spring.datasource.username=postgres
spring.datasource.password=1234567890

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================

# 256-bit Base64-encoded HMAC-SHA256 signing key.
# PLACEHOLDER ONLY — replace with a securely generated secret before deploying.
# Generate a new Base64 key with: openssl rand -base64 32
jwt.secret=QE5jUmZValk4MnI1dTh4L0E/RChHK0tiUGRTZ1ZrWXA=

# Token expiration time in milliseconds.
# 86400000 ms = 60s x 60m x 24h = 24 hours.
# After this period the token is invalid and the user must re-authenticate.
jwt.expiration=86400000